<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="optTitle"></title>
  <link rel="stylesheet" href="../ui/pages.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="layout">
    <nav class="sidebar" data-i18n-aria-label="optNavLabel">
      <p class="brand" data-i18n="optBrand"></p>
      <ul class="nav">
        <li><a href="#general" data-i18n="navGeneral"></a></li>
        <li><a href="#features" data-i18n="navFeatures"></a></li>
        <li><a href="#factions" data-i18n="navFactions"></a></li>
        <li><a href="#intrastek" data-i18n="navIntrastek"></a></li>
        <li><a href="#about" data-i18n="navAbout"></a></li>
      </ul>
    </nav>
    <main class="content">
      <section class="panel" data-panel="general" aria-labelledby="h-general" hidden>
        <h1 id="h-general" data-i18n="generalTitle"></h1>
        <p class="intro" data-i18n="generalIntro"></p>
        <div class="card" id="generalBody"></div>
      </section>

      <section class="panel" data-panel="features" aria-labelledby="h-features" hidden>
        <h1 id="h-features" data-i18n="featuresTitle"></h1>
        <p class="intro" data-i18n="featuresIntro"></p>
        <div id="featuresBody"></div>
      </section>

      <section class="panel" data-panel="factions" aria-labelledby="h-factions" hidden>
        <h1 id="h-factions" data-i18n="factionsTitle"></h1>
        <p class="intro" data-i18n="factionsIntro"></p>
        <div class="card">
          <h2 data-i18n="factionsConnTitle"></h2>
          <div id="factionConn"></div>
        </div>
        <div class="card">
          <h2 data-i18n="factionsListTitle"></h2>
          <p id="factionStatus" class="status" role="status" aria-live="polite"></p>
          <ul id="factionList" class="faction-list"></ul>
          <form id="factionForm" class="faction-form">
            <input type="text" id="factionName" class="input" required data-i18n-placeholder="factionNamePlaceholder" data-i18n-aria-label="factionNameLabel" />
            <input type="color" id="factionColor" value="#4f8cff" data-i18n-aria-label="factionColorLabel" />
            <button type="submit" id="factionAdd" class="btn btn--primary" data-i18n="factionAdd"></button>
          </form>
        </div>
      </section>

      <section class="panel" data-panel="intrastek" aria-labelledby="h-intrastek" hidden>
        <h1 id="h-intrastek" data-i18n="intrastekTitle"></h1>
        <p class="intro" data-i18n="intrastekIntro"></p>
        <div class="card" id="intrastekBody"></div>
      </section>

      <section class="panel" data-panel="about" aria-labelledby="h-about" hidden>
        <h1 id="h-about" data-i18n="aboutTitle"></h1>
        <p class="intro" data-i18n="aboutIntro"></p>
        <div class="card">
          <p id="aboutVersion"></p>
          <p class="actions">
            <a class="btn btn--secondary" href="../setup/setup.html" data-i18n="aboutSetup"></a>
            <a class="btn btn--secondary" href="https://my.epitech.eu" target="_blank" rel="noopener" data-i18n="aboutIntranet"></a>
          </p>
        </div>
      </section>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
