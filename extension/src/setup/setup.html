<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="setupTitle"></title>
  <link rel="stylesheet" href="../ui/pages.css" />
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
  <main class="setup">
    <header class="setup-header">
      <h1 data-i18n="setupHeading"></h1>
      <p class="intro" data-i18n="setupLead"></p>
    </header>

    <nav data-i18n-aria-label="setupStepsLabel">
      <ol class="stepper">
        <li><a href="#step-1"><span class="step-num">1</span> <span data-i18n="stepLanguage"></span></a></li>
        <li><a href="#step-2"><span class="step-num">2</span> <span data-i18n="stepFactions"></span></a></li>
        <li><a href="#step-3"><span class="step-num">3</span> <span data-i18n="stepIntrastek"></span></a></li>
        <li><a href="#step-4"><span class="step-num">4</span> <span data-i18n="stepFeatures"></span></a></li>
        <li><a href="#step-5"><span class="step-num">5</span> <span data-i18n="stepDone"></span></a></li>
      </ol>
    </nav>

    <section class="card step" data-step="1" aria-labelledby="h-step-1" hidden>
      <h2 id="h-step-1" tabindex="-1" data-i18n="languageTitle"></h2>
      <p class="intro" data-i18n="languageText"></p>
      <div id="languageBody"></div>
    </section>

    <section class="card step" data-step="2" aria-labelledby="h-step-2" hidden>
      <h2 id="h-step-2" tabindex="-1" data-i18n="factionsTitle"></h2>
      <p class="intro" data-i18n="factionsText"></p>
      <div id="factionsBody"></div>
      <p class="hint" data-i18n="skip"></p>
    </section>

    <section class="card step" data-step="3" aria-labelledby="h-step-3" hidden>
      <h2 id="h-step-3" tabindex="-1" data-i18n="intrastekTitle"></h2>
      <p class="intro" data-i18n="intrastekText"></p>
      <div id="intrastekBody"></div>
      <p class="hint" data-i18n="skip"></p>
    </section>

    <section class="card step" data-step="4" aria-labelledby="h-step-4" hidden>
      <h2 id="h-step-4" tabindex="-1" data-i18n="featuresTitle"></h2>
      <p class="intro" data-i18n="featuresText"></p>
      <div id="featuresBody"></div>
    </section>

    <section class="card step" data-step="5" aria-labelledby="h-step-5" hidden>
      <h2 id="h-step-5" tabindex="-1" data-i18n="doneTitle"></h2>
      <p class="intro" data-i18n="doneText"></p>
      <p class="actions">
        <a class="btn btn--primary" href="https://my.epitech.eu" data-i18n="openIntranet"></a>
        <a class="btn btn--secondary" href="../options/options.html" data-i18n="openSettings"></a>
      </p>
    </section>

    <footer class="setup-footer">
      <button type="button" id="back" class="btn btn--ghost" data-i18n="back"></button>
      <button type="button" id="next" class="btn btn--primary" data-i18n="next"></button>
    </footer>
  </main>
  <script src="setup.js"></script>
</body>
</html>
