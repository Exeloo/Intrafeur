services:
  epitools-backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ALLOWED_TOKENS=${ALLOWED_TOKENS}
      - PORT=3000
    volumes:
      - epitools-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  epitools-data:
